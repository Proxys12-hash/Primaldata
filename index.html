<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIMAL PANIC | FROST TERMINAL</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --accent: #00d2ff; 
            --accent-glow: rgba(0, 210, 255, 0.4);
            --bg-dark: #05070a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-blur: 12px;
        }

        * { box-sizing: border-box; }

        body { 
            background: var(--bg-dark); 
            color: #e0e6ed; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        #snow-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; opacity: 0.6;
        }

        #login-overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #0a111a 0%, #000 100%);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.6s ease;
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(var(--card-blur));
            border: 1px solid var(--glass-border);
            padding: 40px; border-radius: 24px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 90%; max-width: 400px;
        }

        .security-icon { font-size: 40px; margin-bottom: 10px; filter: drop-shadow(0 0 10px var(--accent)); }

        #dashboard { 
            display: none; width: 95%; max-width: 1200px; 
            margin: 40px auto; padding-bottom: 100px;
        }

        .header {
            text-align: left; margin-bottom: 40px; border-left: 4px solid var(--accent);
            padding-left: 20px;
        }

        h1 { 
            margin: 0; font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; 
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .console-box {
            background: var(--glass);
            backdrop-filter: blur(var(--card-blur));
            border: 1px solid var(--glass-border);
            padding: 30px; border-radius: 20px; margin-bottom: 40px;
        }

        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
        
        .input-wrap label { 
            display: block; font-size: 11px; font-weight: 600; 
            color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
        }

        input, select {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            color: #fff; padding: 12px 16px; border-radius: 12px; outline: none;
        }

        .btn-action {
            background: var(--accent); color: #000; border: none; padding: 16px;
            font-weight: 700; cursor: pointer; border-radius: 12px; width: 100%;
            margin-top: 25px; transition: all 0.3s ease;
        }

        .table-container {
            background: var(--glass); backdrop-filter: blur(var(--card-blur));
            border-radius: 20px; border: 1px solid var(--glass-border); overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.5); text-transform: uppercase; 
             font-size: 10px; padding: 20px; text-align: left; }
        td { padding: 20px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.02); }

        .status-pill { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .status-active { background: rgba(0, 255, 127, 0.1); color: #00ff7f; }
        .status-break { background: rgba(255, 165, 0, 0.1); color: #ffa500; }
        .status-exempt { background: rgba(255, 255, 255, 0.1); color: #fff; }
        
        .btn-edit { color: var(--accent); cursor: pointer; margin-right: 15px; }
        .btn-del { color: #ff5f5f; cursor: pointer; }

        #expiry-timer { font-size: 12px; color: #ff5f5f; margin-top: 15px; font-weight: 600; }
        .view-mode .admin-only { display: none !important; }
    </style>
</head>
<body id="main-body">

    <canvas id="snow-canvas"></canvas>

    <div id="login-overlay">
        <div class="login-card">
            <div class="security-icon">❄️</div>
            <h2 style="margin: 0 0 10px 0;">Identity Check</h2>
            <p style="color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 25px;">Enter session key to access the terminal.</p>
            <input type="text" id="access-key" placeholder="••••••••" style="text-align: center; letter-spacing: 4px; font-size: 20px;">
            <div id="expiry-timer">Connecting to database...</div>
            <button class="btn-action" onclick="verifyAccess()">AUTHORIZE ACCESS</button>
        </div>
    </div>

    <div id="dashboard">
        <div class="header">
            <h1>Staff Registry</h1>
            <p id="access-label" style="margin: 5px 0; font-size: 13px; opacity: 0.6;"></p>
        </div>

        <div class="console-box admin-only">
            <h3 style="margin: 0 0 20px 0;">Manage Personnel</h3>
            <input type="hidden" id="edit-id">
            <div class="grid-inputs">
                <div class="input-wrap"><label>Staff Username</label><input type="text" id="name"></div>
                <div class="input-wrap"><label>Security Rank</label><input type="text" id="rank"></div>
                <div class="input-wrap"><label>Region</label><input type="text" id="region"></div>
                <div class="input-wrap"><label>Joined Date</label><input type="date" id="joined"></div>
                <div class="input-wrap"><label>Duty Status</label>
                    <select id="status">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="ON BREAK">ON BREAK</option>
                        <option value="EXEMPT">EXEMPT</option>
                    </select>
                </div>
                <div class="input-wrap"><label>Strikes</label><input type="number" id="strikes" value="0"></div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="main-btn" class="btn-action" onclick="saveStaff()">SAVE TO DATABASE</button>
                <button id="cancel-btn" style="display:none; background: rgba(255,255,255,0.05); color: #fff;" class="btn-action" onclick="resetForm()">CANCEL</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Staff Identity</th><th>Rank</th><th>Region</th><th>Joined</th><th>Status</th><th>Strikes</th>
                        <th class="admin-only">Management</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAc-iRo-enyFz1PHefmLjGBCKvBjWWWoXs",
            authDomain: "primaldata-700c3.firebaseapp.com",
            databaseURL: "https://primaldata-700c3-default-rtdb.firebaseio.com",
            projectId: "primaldata-700c3",
            storageBucket: "primaldata-700c3.firebasestorage.app",
            messagingSenderId: "891841602542",
            appId: "1:891841602542:web:9eb20090b614d762b5a4ff"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- WEBHOOK URL (DIRECT LINK) ---
        const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1455188856189227282/HbFUbggQQ7Fa8SFiGMmbQOjYoktu8vflyc9Pn9Rjjq9j1P8RzLeZrWk7AvhdXgaxB5Y9";
        
        let isAdmin = false;
        let staffList = {};

        const dispatch = async (data) => {
            try {
                await fetch(DISCORD_WEBHOOK, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
            } catch (e) { console.error("Webhook Error:", e); }
        };

        window.addEventListener('DOMContentLoaded', async () => {
            const timerDisplay = document.getElementById('expiry-timer');
            try {
                const characters = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                let randomCode = '';
                for (let i = 0; i < 8; i++) randomCode += characters.charAt(Math.floor(Math.random() * characters.length));
                
                await db.ref('current_session').set({ code: randomCode });

                dispatch({
                    "embeds": [{ 
                        "title": "❄️ Terminal Session Initiated", 
                        "description": `Authorization Key: \`${randomCode}\`\nStatus: \`AWAITING LOGIN\``, 
                        "color": 52479,
                        "timestamp": new Date().toISOString()
                    }]
                });

                let timeLeft = 30;
                timerDisplay.innerText = `Admin session expires in: ${timeLeft}s`;
                const countdown = setInterval(() => {
                    timeLeft--;
                    if(timerDisplay) timerDisplay.innerText = `Admin session expires in: ${timeLeft}s`;
                    if (timeLeft <= 0) {
                        clearInterval(countdown);
                        db.ref('current_session').remove();
                        if(timerDisplay) timerDisplay.innerText = "Session expired. Refresh for new key.";
                    }
                }, 1000);

            } catch (error) {
                timerDisplay.innerText = "Connection Error. Check Rules.";
            }
        });

        function verifyAccess() {
            const key = document.getElementById('access-key').value.trim().toUpperCase();
            if (key === "VIEW") {
                isAdmin = false;
                document.getElementById('main-body').classList.add('view-mode');
                document.getElementById('access-label').innerText = "VIEW ONLY";
                enterDashboard();
                return;
            }
            db.ref('current_session').once('value', (snap) => {
                const data = snap.val();
                if (data && data.code === key) {
                    isAdmin = true;
                    document.getElementById('access-label').innerText = "ADMIN ACCESS";
                    enterDashboard();
                } else { alert("Invalid Key."); }
            });
        }

        function enterDashboard() {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            db.ref('staff').on('value', snap => {
                staffList = snap.val() || {};
                renderTable();
            });
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            Object.values(staffList).forEach(m => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td style="font-weight:600; color:var(--accent)">${m.name}</td>
                    <td>${m.rank}</td>
                    <td>${m.region}</td>
                    <td>${m.joined}</td>
                    <td><span class="status-pill status-${m.status === 'ON BREAK' ? 'break' : m.status === 'EXEMPT' ? 'exempt' : 'active'}">${m.status}</span></td>
                    <td>${m.strikes}</td>
                    ${isAdmin ? `<td><span class="btn-edit" onclick="startEdit('${m.id}')">Edit</span> | <span class="btn-del" onclick="deleteStaff('${m.id}')">Del</span></td>` : ''}
                `;
            });
        }

        async function saveStaff() {
            if (!isAdmin) return;
            const id = document.getElementById('edit-id').value || Date.now();
            const data = {
                id,
                name: document.getElementById('name').value,
                rank: document.getElementById('rank').value,
                region: document.getElementById('region').value,
                joined: document.getElementById('joined').value,
                status: document.getElementById('status').value,
                strikes: document.getElementById('strikes').value
            };
            if (!data.name) return;
            await db.ref('staff/' + id).set(data);
            dispatch({ "embeds": [{ "title": "Record Updated", "description": `Staff: ${data.name}`, "color": 52479 }] });
            resetForm();
        }

        function startEdit(id) {
            const m = staffList[id];
            document.getElementById('edit-id').value = m.id;
            document.getElementById('name').value = m.name;
            document.getElementById('rank').value = m.rank;
            document.getElementById('region').value = m.region;
            document.getElementById('joined').value = m.joined;
            document.getElementById('status').value = m.status;
            document.getElementById('strikes').value = m.strikes;
            document.getElementById('cancel-btn').style.display = "block";
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            document.querySelectorAll('.console-box input').forEach(i => i.value = '');
            document.getElementById('strikes').value = '0';
            document.getElementById('cancel-btn').style.display = "none";
        }

        function deleteStaff(id) { if(confirm("Delete?")) db.ref('staff/' + id).remove(); }

        // Snow Canvas logic
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();
        class Particle {
            constructor() { this.reset(); this.y = Math.random() * canvas.height; }
            reset() { this.x = Math.random() * canvas.width; this.y = -10; this.size = Math.random() * 2; this.speed = Math.random() * 0.5 + 0.2; this.opacity = Math.random() * 0.5; }
            update() { this.y += this.speed; if (this.y > canvas.height) this.reset(); }
            draw() { ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        for (let i = 0; i < 70; i++) particles.push(new Particle());
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
        animate();
    </script>
</body>
</html>
